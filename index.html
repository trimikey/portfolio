<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <script>
      // Apply the saved theme before the first paint to avoid a flash. Dark is the default.
      (function () {
        var theme = 'dark';
        try {
          if (localStorage.getItem('theme') === 'light') theme = 'light';
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'light' ? '#f8f8fa' : '#050505');
      })();
    </script>
    <title>Le Duc Tri | Fullstack Web Developer</title>
    <meta
      name="description"
      content="Le Duc Tri - Fullstack Web Developer based in Ho Chi Minh City. React, NestJS, TypeScript, PostgreSQL, real-time systems and scalable backends."
    />
    <meta property="og:title" content="Le Duc Tri | Fullstack Web Developer" />
    <meta
      property="og:description"
      content="Fullstack Web Developer crafting solid architectures, intuitive UI/UX, robust APIs and high-performance applications."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/avatar.jpg" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
